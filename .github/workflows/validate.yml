name: Validate skills
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: sh scripts/validate-skills.sh
      - run: python -m pip install -r skills/chicago-transit-duckdb/scripts/requirements.txt duckdb==2.0.0
      - run: python skills/chicago-transit-duckdb/scripts/test_transit_archive.py
